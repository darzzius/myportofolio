<div id="{{ section }}-form-modal" class="project-form-modal" popover="auto"
     role="dialog" aria-modal="true" aria-labelledby="{{ section }}-form-title" data-form-modal>
    <button type="button" class="project-form-modal__backdrop"
            popovertarget="{{ section }}-form-modal" popovertargetaction="hide"
            aria-label="Tutup formulir"></button>
    <div class="project-form-modal__content">
        <button type="button" class="project-form-modal__close"
                popovertarget="{{ section }}-form-modal" popovertargetaction="hide"
                aria-label="Tutup formulir">&times;</button>
        <h2 id="{{ section }}-form-title" data-form-title>Tambah {{ item_label }}</h2>
        <form method="post" action="{{ list_url }}" class="project-form" data-portfolio-form>
            {% csrf_token %}
            {% for field in form %}
                <div class="form-group">
                    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                </div>
            {% endfor %}
            <div class="project-form-modal__actions">
                <button type="button" class="button button-secondary"
                        popovertarget="{{ section }}-form-modal" popovertargetaction="hide">Batal</button>
                <button type="submit" class="button" data-save>Simpan</button>
            </div>
        </form>
    </div>
</div>
