        {% extends 'base.html' %}
        {% block content %}
        <main>
            <div class="logo-box">
                <img class="hero-logo-img" src="/static/img/logo_darius.png" alt="Darius Logo">
            </div>
            <div class="wave-divider">
                <svg viewBox="0 0 1440 100" preserveAspectRatio="none"> 
                    <defs>
                        <linearGradient id="backWaveGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" stop-color="#64748b" />
                            <stop offset="100%" stop-color="#475569" />
                        </linearGradient>

                        <linearGradient id="frontWaveGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" stop-color="#cbd5e1" />
                            <stop offset="100%" stop-color="#ffffff" />
                        </linearGradient>
                    </defs>
                    <path fill="url(#backWaveGrad)" d="M0,30 C300,90 600,-20 900,50 C1140,105 1320,20 1440,40 L1440,100 L0,100 Z"></path>
                    <path fill="#94a3b8" opacity="0.75" d="M0,60 C360,15 620,105 920,45 C1160,85 1320,35 1440,75 L1440,140 L0,140 Z"></path>
                    <path fill="url(#frontWaveGrad)" d="M0,85 C300,135 600,30 900,85 C1140,125 1320,60 1440,80 L1440,140 L0,140 Z"></path>
                </svg> 
            </div>
            <section class="hero" id="profile">
                <div class="container hero-grid">
                    <div class="hero-identity">
                        <p class="hero-kicker">Information System &middot; Universitas Indonesia</p>
                        <h1>{{ name }}</h1>
                    </div>
                    <div class="hero-photo">
                        <img class="avatar" src="/static/img/darius.jpg" alt="Photo of {{ name }}">
                    </div>
                    <div class="hero-details">
                        <p class="bio">{{ bio }}</p>
                        <dl class="meta-list">
                            <div class="meta-row">
                                <dt>NPM</dt>
                                <dd>{{ npm }}</dd>
                            </div>
                            <div class="meta-row">
                                <dt>Program</dt>
                                <dd>{{ study_program }}</dd>
                            </div>
                        </dl>
                        <div class="social-links">
                            <a href="https://github.com/darzzius" class="social-link">GitHub</a>
                            <a href="https://linkedin.com/in/rafael-darius-sagala" class="social-link">LinkedIn</a>
                            <a href="mailto:dariussagala0507@gmail.com" class="social-link">Email</a>
                        </div>
                    </div>
                </div>
                <br>
            </section>
            <div class="wave-divider-bottom">
            <svg viewBox="0 0 1440 100" preserveAspectRatio="none">
                <path fill="#000000" d="M0,35 C320,135 600,-10 920,85 C1180,145 1340,15 1440,45 L1440,150 L0,150 Z"></path>
            </svg>
        </div>
        </main>
        {% endblock content %}
